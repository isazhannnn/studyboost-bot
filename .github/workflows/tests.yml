name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q .
      - run: python tools/check_secrets.py
      - name: Reject tracked private files
        shell: python
        run: |
          import pathlib, subprocess
          paths = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          forbidden = [p for p in paths if (
              pathlib.PurePosixPath(p).name in {'config.json', 'cloud_config.json', '.env'}
              or pathlib.PurePosixPath(p).suffix in {'.db', '.sqlite', '.sqlite3', '.pem', '.key', '.log'}
              or p.startswith('pdf_exports/')
          )]
          if forbidden:
              raise SystemExit('Private files are tracked: ' + ', '.join(forbidden))
